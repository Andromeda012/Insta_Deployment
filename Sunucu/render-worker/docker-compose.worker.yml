# ============================================================================
# GLOBAL MOBİLYA — MODÜL 8 RENDER WORKER COMPOSE SPECIFICATION (1vCPU / 2GB VPS)
# ============================================================================
# RUNS COMPLETELY INDEPENDENT FROM 'nova-publisher'
# Conservative limits tuned for 1 vCPU / ~2 GB RAM DigitalOcean Droplet so
# 'nova-publisher' is NEVER starved of CPU or memory.
# ============================================================================

services:
  nova-render-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_BLENDER: "true"
    container_name: nova_render_worker
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=nova-render-worker
      - TZ=Europe/Istanbul
      - BLENDER_DEVICE=CPU
      - CYCLES_CPU_THREADS=1
      - BLENDER_NICE_LEVEL=19
      - MAX_LOAD_AVG=1.5
      - MIN_FREE_MEM_MB=350
    # HARD RESOURCE LIMITS TUNED FOR 1 vCPU / ~2 GB RAM VPS TO PROTECT PUBLISHER
    deploy:
      resources:
        limits:
          cpus: '0.60'       # Max 60% of 1 vCPU core; reserves >= 40% CPU for publisher & OS
          memory: 850M       # Max 850MB RAM; reserves >= 1150MB RAM for publisher & OS
        reservations:
          cpus: '0.15'
          memory: 256M
    # SECURITY HARDENING
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    # REAL WORKER & BLENDER HEALTHCHECK
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - worker_isolated_net

networks:
  worker_isolated_net:
    driver: bridge
