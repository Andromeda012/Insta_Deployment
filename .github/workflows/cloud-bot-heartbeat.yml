name: 7/24 Cloud Bot Autonomous Heartbeat

# ============================================================================
# NOVA PUBLISHER VPS MİGRASYONU SONRASI DURUM:
# Otonom sosyal medya yayınlama (Instagram ve Facebook post/story/reels)
# zamanlaması artık VPS Publisher (nova-publisher) üzerindeki merkezi
# otonom scheduler tarafından yönetilmektedir.
# Mükerrer yayın ve slot çakışmalarını önlemek için GitHub Actions üzerinden
# otomatik zamanlanmış yayın curl tetikleyicileri devre dışı bırakılmıştır.
# ============================================================================

on:
  workflow_dispatch:

concurrency:
  group: cloud-bot-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Instagram Comment & DM Scanner (Gemini AI Responder)
        run: |
          curl -s -m 50 "https://insta-deployment-rho.vercel.app/api/instagram-cron?action=scan_dms" || true
